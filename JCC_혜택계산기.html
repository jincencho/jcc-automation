<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCC 진센조 | 일반구매 vs 삼성AI구독 혜택 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&family=Montserrat:wght@300;600&display=swap');

:root {
  color-scheme: dark;
  --bg-color: #0b1120;
  --text-primary: #ffffff;
  --text-secondary: #94a3b8;
  --accent-gold: #d4af37;
  --accent-gold-light: #fde68a;
  --accent-blue: #3b82f6; 
  --accent-purple: #8b5cf6;
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.1);
  --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  
  /* Spacing Scale */
  --space-xs: 0.5rem;
  --space-sm: 1rem;
  --space-md: 2rem;
  --space-lg: 4rem;
  --space-xl: 8rem;
  --nav-logo-height: 50px;
}

@media (max-width: 768px) {
  :root {
    --nav-logo-height: 35px;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Responsive Typography */
h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; }
h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); line-height: 1.2; }
h3 { font-size: clamp(1.2rem, 3vw, 1.8rem); }
p { font-size: clamp(0.95rem, 2vw, 1.1rem); }

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--space-md);
}

section {
  padding: var(--space-lg) 0;
}

/* Glassmorphism Utilities */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: var(--space-md);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.glass-panel:hover {
  transform: translateY(-8px);
  border-color: rgba(212, 175, 55, 0.3);
  box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
}

/* Text Gradients */
.text-gradient {
  background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
}

/* Base Buttons */
.btn-primary {
  background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
  color: #0b1120;
  border: none;
  padding: 1rem 2.5rem;
  border-radius: 14px;
  font-weight: 800;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
  white-space: nowrap;
}

.btn-primary:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.5);
  filter: brightness(1.1);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: var(--accent-gold);
  border: 1px solid var(--accent-gold);
  padding: 1rem 2.5rem;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  white-space: nowrap;
}

.btn-secondary:hover {
  background: rgba(212, 175, 55, 0.1);
  border-color: var(--accent-gold-light);
  transform: translateY(-4px);
}

.btn-back {
  background: rgba(255, 255, 255, 0.05);
  color: var(--accent-gold);
  border: 1px solid var(--accent-gold);
  padding: 0.7rem 1.6rem;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: var(--space-md);
}

.btn-back:hover {
  background: var(--accent-gold);
  color: #0b1120;
  transform: translateX(-6px);
}

/* CTA Pulse Animation (Enhanced) */
@keyframes pulse-gold {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
  50% { transform: scale(1.05); box-shadow: 0 0 35px 15px rgba(212, 175, 55, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
}

.pulse {
  animation: pulse-gold 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-primary:hover, .btn-secondary:hover {
  transform: translateY(-6px) scale(1.03);
  filter: brightness(1.2);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(212, 175, 55, 0.4);
}

.btn-primary:active, .btn-secondary:active {
  transform: translateY(2px) scale(0.96);
}

/* Floating Animation for Secondary CTA */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

.float {
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1);
}

.float:hover {
  animation-play-state: paused;
}

/* Layout Helpers */
.flex-center {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- Mobile Responsiveness --- */
@media (max-width: 1024px) {
  .container { padding: 0 var(--space-md); }
}

@media (max-width: 768px) {
  section { padding: var(--space-md) 0; }
  
  .glass-panel {
    padding: var(--space-sm);
    border-radius: 18px;
  }
  
  .btn-primary, .btn-secondary {
    width: 100%;
    padding: 1.2rem !important;
  }

  .nav-links {
    gap: 0.8rem !important;
    font-size: 0.85rem !important;
  }

  nav {
    padding: 1rem !important;
  }

  /* Force stack on mobile */
  .mobile-stack {
    flex-direction: column !important;
    gap: var(--space-md) !important;
    text-align: center;
  }
  
  .mobile-hide { display: none !important; }
}

/* Smooth Scroll */
html {
  scroll-behavior: smooth;
}

/* Social Links Responsiveness */
@media (max-width: 768px) {
  .social-grid {
    justify-content: center;
  }
  .social-label {
    justify-content: center;
  }
}


/* ============================================================================
   BENEFIT CALCULATOR & A4 PRINT SHEET STYLES
   ============================================================================ */
.calc-no-hover:hover {
  transform: none !important;
}

.a4-sheet-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 0.75rem 2.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
}

@media screen and (max-width: 860px) {
  .a4-sheet-wrapper {
    align-items: flex-start;
  }
}

.a4-print-sheet {
  width: 820px;
  min-width: 820px;
  max-width: 820px;
  background: #ffffff;
  color: #0f172a;
  border-radius: 16px;
  padding: 1.8rem 2rem;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
  font-family: 'Noto Sans KR', 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  flex-shrink: 0;
  box-sizing: border-box;
}

/* 1. 상단 리포트 헤더 */
.a4-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  padding-bottom: 0.9rem;
  border-bottom: 2px solid #0f172a;
}

.a4-tag-gold {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #92660a;
  background: #fef3c7;
  border: 1px solid #f59e0b;
  padding: 2px 8px;
  border-radius: 4px;
}

.a4-doc-title {
  font-size: 1.38rem;
  font-weight: 900;
  color: #0f172a;
  letter-spacing: -0.5px;
  line-height: 1.25;
  margin: 0.15rem 0 0.2rem;
  word-break: keep-all;
}

.a4-doc-subtitle {
  font-size: 0.81rem;
  color: #475569;
  font-weight: 500;
  margin: 0;
  word-break: keep-all;
}

.a4-header-right {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 0.6rem 0.9rem;
  min-width: 215px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.a4-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.8rem;
  white-space: nowrap;
}

.a4-meta-label {
  color: #64748b;
  font-weight: 600;
}

.a4-meta-val {
  color: #0f172a;
  font-weight: 700;
}

.a4-meta-badge {
  background: #0f172a;
  color: #fde68a;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
}

/* 품목 요약 바 */
.a4-product-bar {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 0.45rem 0.8rem;

}

.a4-product-bar-label {
  background: #334155;
  color: #ffffff;
  font-weight: 700;
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 1px;
  white-space: nowrap;
}

.a4-product-bar-text {
  color: #1e293b;
  font-weight: 600;
  line-height: 1.4;
  word-break: keep-all;
}

/* 2. 최종 체감가 차이 강조 배너 */
.a4-highlight-banner {
  border-radius: 12px;
  padding: 0.82rem 1.1rem;
  text-align: center;
}

.a4-highlight-banner.winner-sub {
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
  border: 2px solid #2563eb;
}

.a4-highlight-banner.winner-lump {
  background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  border: 2px solid #d97706;
}

.a4-highlight-badge-top {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.73rem;
  font-weight: 800;
  color: #1e3a8a;
  margin-bottom: 0.25rem;
}

.winner-lump .a4-highlight-badge-top {
  color: #92400e;
}

.a4-highlight-headline {
  font-size: 1.02rem;
  font-weight: 800;
  color: #0f172a;
  line-height: 1.4;
  margin: 0;
  word-break: keep-all;
}

.a4-diff-pill {
  display: inline-block;
  background: #1d4ed8;
  color: #ffffff;
  padding: 1px 9px;
  border-radius: 999px;
  font-weight: 900;
  margin: 0 2px 0 5px;
  white-space: nowrap;
}

.winner-lump .a4-diff-pill {

}

.a4-highlight-sub {
  font-size: 0.74rem;
  color: #475569;
  font-weight: 600;
  line-height: 1.35;
  margin-top: 0.22rem;
  word-break: keep-all;
}

/* 3. 좌우 1:1 비교 그리드 (4단 수평 줄맞춤 Subgrid) */
.a4-compare-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto auto 1fr auto;
  column-gap: 0.9rem;
  row-gap: 0;
  align-items: stretch;
}

.a4-plan-card {
  grid-row: 1 / span 4;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: subgrid;
  min-width: 0;
  border: 1.5px solid #cbd5e1;
  border-radius: 12px;
  overflow: hidden;
  background: #ffffff;
}

.a4-plan-recommended {
  border: 2px solid #d97706;
}

.a4-plan-recommended-blue {
  border: 2px solid #2563eb;
}

.a4-plan-header {
  padding: 0.68rem 0.95rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
}

.a4-plan-header.plan-lump {
  background: #1e293b;
  color: #ffffff;
}

.a4-plan-header.plan-sub {
  background: #1e3a8a;
  color: #ffffff;
}

.a4-plan-kicker {
  display: block;
  font-size: 0.67rem;
  font-weight: 700;
  opacity: 0.88;
  letter-spacing: 0.4px;
  white-space: nowrap;
}

.a4-plan-title {
  font-size: 1.05rem;
  font-weight: 800;
  margin: 0.08rem 0 0;

  white-space: nowrap;
}

.a4-rec-chip {
  background: #fbbf24;
  color: #0f172a;
  font-size: 0.7rem;
  font-weight: 900;
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.a4-rec-chip.chip-blue {
  background: #fde68a;
  color: #1e3a8a;
}

.a4-plan-top {
  padding: 0.72rem 0.95rem 0.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.34rem;
}

.a4-plan-middle {
  padding: 0.2rem 0.95rem 0.65rem;
  display: flex;
  flex-direction: column;
  gap: 0.36rem;
}

.a4-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.8rem;
  color: #334155;
  padding: 0.2rem 0;
  word-break: keep-all;
}

.a4-row > span:first-child {
  white-space: nowrap;
  flex-shrink: 0;
}

.a4-row strong {
  white-space: nowrap;
  flex-shrink: 0;
}

.a4-row-base {
  font-size: 0.85rem;
  padding-bottom: 0.38rem;
  border-bottom: 1px solid #e2e8f0;
  color: #0f172a;
}

.a4-divider-label {
  font-size: 0.72rem;
  font-weight: 800;
  color: #64748b;
  margin-top: 0.1rem;
}

.a4-benefit-list {
  flex: 1;
  width: 100%;
  min-width: 0;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 0.55rem 0.68rem;
  min-height: 86px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.32rem;
}

.a4-benefit-row {
  width: 100%;
  min-width: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.76rem;
  line-height: 1.36;
  color: #334155;
  word-break: keep-all;
}

.a4-benefit-row > span:first-child {
  min-width: 0;
  white-space: nowrap;
}

.a4-benefit-note {
  color: #64748b;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

.a4-minus {
  color: #b45309;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

.a4-minus-blue {
  color: #1d4ed8;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

.a4-benefit-total-row {

.a4-plan-footer {

.a4-plan-footer.footer-sub {

.a4-final-row {

.a4-final-label {

}

.a4-final-price {
  font-size: 1.28rem;
  font-weight: 900;
  color: #b45309;
  white-space: nowrap;
}

.a4-final-price.price-blue {
  color: #1d4ed8;
}

/* 좌·우 카드 푸터 하단 보조 영역 (동일기간 할부 / 제휴카드 월 실납부액) */
.a4-footer-sub-box {
  flex: 1;
  margin-top: 0.42rem;
  padding-top: 0.42rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.14rem;
}

}

.a4-footer-sub-box.sub-box-blue {

}

.a4-footer-sub-main {

  justify-content: space-between;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.76rem;
  font-weight: 700;
  color: #334155;
  white-space: nowrap;
}

}

.sub-box-blue .a4-footer-sub-main {

}

.sub-strong-red {

}

.sub-strong-blue {

  font-weight: 800;

.a4-footer-sub-note {

  font-size: 0.7rem;

}

.a4-footer-sub-note.note-blue {

.a4-card-policy-grid {

  column-gap: 0.4rem;

.a4-card-policy-item {

  align-items: center;
  gap: 0.28rem;

.a4-status-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  font-size: 0.62rem;
  font-weight: 900;
  flex-shrink: 0;
}

.a4-status-tag.tag-o {

  color: #15803d;

}

.a4-status-tag.tag-x {
  background: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
}

.a4-status-tag.tag-tri {
  background: #fef3c7;
  color: #b45309;
  border: 1px solid #fde68a;
}

.a4-card-feature-label {
  font-weight: 700;
  color: #0f172a;
  flex-shrink: 0;
  white-space: nowrap;
}

.a4-card-feature-text {
  color: #64748b;
  font-size: 0.67rem;
  flex-shrink: 0;
  white-space: nowrap;
}

.a4-checkpoints-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem 0.75rem;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 0.55rem 0.8rem;
}

.a4-checkpoint-item {
  display: flex;
  align-items: center;
  gap: 0.38rem;
  font-size: 0.76rem;
  font-weight: 700;
  color: #1e293b;
  word-break: keep-all;
}

.a4-memo-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 8px;
  padding: 0.55rem 0.8rem;
}

.a4-memo-title {
  font-size: 0.75rem;
  font-weight: 800;
  color: #92400e;
  margin-bottom: 0.18rem;
}

.a4-memo-content {
  font-size: 0.77rem;
  color: #1e293b;
  white-space: pre-wrap;
  line-height: 1.42;
  word-break: keep-all;
}

.a4-disclaimer {
  font-size: 0.63rem;
  color: #64748b;
  line-height: 1.38;
  margin: 0;
  word-break: keep-all;
}

/* 5. 하단 조준석 매니저 명함 */
.a4-manager-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.65rem;
  background: #0f172a;
  color: #ffffff;
  border-radius: 12px;
  padding: 0.75rem 0.95rem;
  border-top: 3px solid #d4af37;
}

.a4-manager-left {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  min-width: 0;
  flex: 1 1 auto;
}

.a4-manager-photo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #d4af37;
  flex-shrink: 0;
}

.a4-manager-role {
  display: inline-block;
  font-size: 0.66rem;
  font-weight: 700;
  color: #fde68a;
  margin-bottom: 0.08rem;
  white-space: nowrap;
}

.a4-manager-name {
  font-size: 0.92rem;
  font-weight: 800;
  color: #ffffff;
  white-space: nowrap;
}

.a4-manager-brand {
  font-size: 0.72rem;
  font-weight: 600;
  color: #cbd5e1;
  white-space: nowrap;
}

.a4-manager-quote {
  font-size: 0.68rem;
  color: #94a3b8;
  margin-top: 0.14rem;
  line-height: 1.36;
  word-break: keep-all;
  white-space: nowrap;
}

.a4-manager-right {
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
  font-size: 0.68rem;
  color: #e2e8f0;
  flex-shrink: 0;
}

.a4-contact-item {
  display: flex;
  align-items: center;
  gap: 0.38rem;
  white-space: nowrap;
}

.a4-manager-qr {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding-left: 0.75rem;
  border-left: 1px solid rgba(255, 255, 255, 0.15);
}

.a4-manager-qr a {
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.a4-manager-qr-label {
  font-size: 0.58rem;
  color: #fde68a;
  font-weight: 700;
  margin-top: 3px;
  white-space: nowrap;
  letter-spacing: -0.2px;
}
