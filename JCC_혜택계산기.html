<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <style>

:root {
  color-scheme: dark;
  --bg-color: #0b1120;
  --text-primary: #ffffff;
  --text-secondary: #94a3b8;
  --accent-gold: #d4af37;
  --accent-gold-light: #fde68a;
  --accent-blue: #3b82f6; 
  --accent-purple: #8b5cf6;
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.1);
  --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  
  /* Spacing Scale */
  --space-xs: 0.5rem;
  --space-sm: 1rem;
  --space-md: 2rem;
  --space-lg: 4rem;
  --space-xl: 8rem;
  --nav-logo-height: 50px;
}

@media (max-width: 768px) {
  :root {
    --nav-logo-height: 35px;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Responsive Typography */
h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; }
h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); line-height: 1.2; }
h3 { font-size: clamp(1.2rem, 3vw, 1.8rem); }
p { font-size: clamp(0.95rem, 2vw, 1.1rem); }

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 var(--space-md);
}

section {
  padding: var(--space-lg) 0;
}

/* Glassmorphism Utilities */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: var(--space-md);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.glass-panel:hover {
  transform: translateY(-8px);
  border-color: rgba(212, 175, 55, 0.3);
  box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
}

/* Text Gradients */
.text-gradient {
  background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
}

/* Base Buttons */
.btn-primary {
  background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
  color: #0b1120;
  border: none;
  padding: 1rem 2.5rem;
  border-radius: 14px;
  font-weight: 800;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
  white-space: nowrap;
}

.btn-primary:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 20px 40px -5px rgba(212, 175, 55, 0.5);
  filter: brightness(1.1);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: var(--accent-gold);
  border: 1px solid var(--accent-gold);
  padding: 1rem 2.5rem;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  white-space: nowrap;
}

.btn-secondary:hover {
  background: rgba(212, 175, 55, 0.1);
  border-color: var(--accent-gold-light);
  transform: translateY(-4px);
}

.btn-back {
  background: rgba(255, 255, 255, 0.05);
  color: var(--accent-gold);
  border: 1px solid var(--accent-gold);
  padding: 0.7rem 1.6rem;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: var(--space-md);
}

.btn-back:hover {
  background: var(--accent-gold);
  color: #0b1120;
  transform: translateX(-6px);
}

/* CTA Pulse Animation (Enhanced) */
@keyframes pulse-gold {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
  50% { transform: scale(1.05); box-shadow: 0 0 35px 15px rgba(212, 175, 55, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
}

.pulse {
  animation: pulse-gold 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-primary:hover, .btn-secondary:hover {
  transform: translateY(-6px) scale(1.03);
  filter: brightness(1.2);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(212, 175, 55, 0.4);
}

.btn-primary:active, .btn-secondary:active {
  transform: translateY(2px) scale(0.96);
}

/* Floating Animation for Secondary CTA */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

.float {
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1);
}

.float:hover {
  animation-play-state: paused;
}

/* Layout Helpers */
.flex-center {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- Mobile Responsiveness --- */
@media (max-width: 1024px) {
  .container { padding: 0 var(--space-md); }
}

@media (max-width: 768px) {
  section { padding: var(--space-md) 0; }
  
  .glass-panel {
    padding: var(--space-sm);
    border-radius: 18px;
  }
  
  .btn-primary, .btn-secondary {
    width: 100%;
    padding: 1.2rem !important;
  }

  .nav-links {
    gap: 0.8rem !important;
    font-size: 0.85rem !important;
  }

  nav {
    padding: 1rem !important;
  }

  /* Force stack on mobile */
  .mobile-stack {
    flex-direction: column !important;
    gap: var(--space-md) !important;
    text-align: center;
  }
  
  .mobile-hide { display: none !important; }
}

/* Smooth Scroll */
html {
  scroll-behavior: smooth;
}

/* Social Links Responsiveness */
@media (max-width: 768px) {
  .social-grid {
    justify-content: center;
  }
  .social-label {
    justify-content: center;
  }
}

  color: #1e293b;
  word-break: keep-all;
}

.a4-memo-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 8px;
  padding: 0.55rem 0.8rem;
}

.a4-memo-title {
  font-size: 0.75rem;
  font-weight: 800;
  color: #92400e;
  margin-bottom: 0.18rem;
}

.a4-memo-content {
  font-size: 0.77rem;
  color: #1e293b;
  white-space: pre-wrap;
  line-height: 1.42;
  word-break: keep-all;
}

.a4-disclaimer {
  font-size: 0.63rem;
  color: #64748b;
  line-height: 1.38;
  margin: 0;
  word-break: keep-all;
}

/* 5. 하단 조준석 매니저 명함 */
.a4-manager-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  background: #0f172a;
  color: #ffffff;
  border-radius: 12px;
  padding: 0.8rem 1rem;
  border-top: 3px solid #d4af37;
}

.a4-manager-left {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  min-width: 0;
}

.a4-manager-photo {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #d4af37;
  flex-shrink: 0;
}

.a4-manager-role {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  color: #fde68a;
  margin-bottom: 0.08rem;
}

.a4-manager-name {
  font-size: 0.95rem;
  font-weight: 800;
  color: #ffffff;
  white-space: nowrap;
}

.a4-manager-brand {
  font-size: 0.75rem;
  font-weight: 600;
  color: #cbd5e1;
}

.a4-manager-quote {
  font-size: 0.72rem;
  color: #94a3b8;
  margin-top: 0.16rem;
  line-height: 1.42;
  word-break: keep-all;
}

.a4-manager-right {
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
  font-size: 0.7rem;
  color: #e2e8f0;
  flex-shrink: 0;
}

.a4-contact-item {
  display: flex;
  align-items: center;
  gap: 0.38rem;
  white-space: nowrap;
}

.a4-manager-qr {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding-left: 0.75rem;
  border-left: 1px solid rgba(255, 255, 255, 0.15);
}

.a4-manager-qr a {
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.a4-manager-qr-label {
  font-size: 0.58rem;
  color: #fde68a;
  font-weight: 700;
  margin-top: 3px;
  white-space: nowrap;
  letter-spacing: -0.2px;
}

/* 모바일 화면에서 미리보기 반응형 (인쇄 시에는 제외) */
@media screen and (max-width: 720px) {
  .a4-print-sheet {
    padding: 1.25rem 1rem;
  }
  .a4-header {
    flex-direction: column;
  }
  .a4-header-right {
    width: 100%;
  }
  .a4-compare-grid {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    row-gap: 0.9rem;
  }
  .a4-plan-card {
    grid-row: auto;
    display: flex;
    flex-direction: column;
  }
  .a4-checkpoints-grid {
    grid-template-columns: 1fr;
  }
  .a4-manager-card {
    flex-direction: column;
    align-items: flex-start;
  }
  .a4-contact-item,
  .a4-manager-quote,
  .a4-row > span:first-child,
  .a4-benefit-row > span:first-child,
  .a4-footer-sub-main,
  .a4-footer-sub-note {
    white-space: normal;
  }
}

/* ============================================================================
   @media print — A4 용지 1장 최적화 출력 스타일 (상·하·좌·우 여백 균형)
   ============================================================================ */
@page {
  size: A4 portrait;
  margin: 12mm 12mm;
}

@media print {
  @page {
    size: A4 portrait;
    margin: 12mm 12mm;
  }

  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  html, body {
    background: #ffffff !important;
    color: #0f172a !important;
    min-height: auto !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
  }

  .site-nav,
  .site-footer,
  .no-print {
    display: none !important;
  }

  .calc-result-section {
    padding: 0 !important;
    margin: 0 !important;
  }

  .a4-sheet-wrapper {
    padding: 0 !important;
    margin: 0 !important;
    display: block !important;
  }

  .a4-print-sheet {
    width: 100% !important;
    max-width: none !important;
    min-height: 268mm !important;
    max-height: 272mm !important;
    box-sizing: border-box !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    padding: 3.5mm 5mm !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    gap: 0.35rem !important;
    page-break-inside: avoid;
    break-inside: avoid;
    overflow: hidden !important;
  }

  .a4-header {
    flex-direction: row !important;
    padding-bottom: 0.38rem !important;
  }

  .a4-header-right {
    padding: 0.38rem 0.65rem !important;
    gap: 0.18rem !important;
  }

  .a4-doc-title {
    font-size: 1.24rem !important;
    margin: 0.08rem 0 !important;
    white-space: nowrap !important;
  }

  .a4-doc-subtitle {
    font-size: 0.74rem !important;
    white-space: nowrap !important;
  }

  .a4-product-bar {
    padding: 0.3rem 0.65rem !important;
    font-size: 0.74rem !important;
  }

  .a4-highlight-banner {
    padding: 0.52rem 0.85rem !important;
    border-radius: 9px !important;
  }

  .a4-highlight-headline {
    font-size: 0.92rem !important;
    margin: 0 !important;
  }

  .a4-highlight-sub {
    font-size: 0.68rem !important;
    margin-top: 0.14rem !important;
  }

  .a4-compare-grid {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
    grid-template-rows: auto auto 1fr auto !important;
    column-gap: 0.65rem !important;
    row-gap: 0 !important;
    flex: 0 0 auto !important;
  }

  .a4-plan-card {
    grid-row: 1 / span 4 !important;
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) !important;
    grid-template-rows: subgrid !important;
    min-width: 0 !important;
  }

  .a4-plan-header {
    padding: 0.48rem 0.75rem !important;
  }

  .a4-plan-title {
    font-size: 0.96rem !important;
  }

  .a4-plan-top {
    padding: 0.5rem 0.75rem 0.18rem !important;
    gap: 0.22rem !important;
  }

  .a4-plan-middle {
    padding: 0.15rem 0.75rem 0.42rem !important;
    gap: 0.25rem !important;
  }

  .a4-row {
    font-size: 0.75rem !important;
    padding: 0.14rem 0 !important;
  }

  .a4-row-base {
    font-size: 0.8rem !important;
    padding-bottom: 0.26rem !important;
  }

  .a4-benefit-list {
    min-height: 76px !important;
    padding: 0.38rem 0.55rem !important;
    gap: 0.22rem !important;
    justify-content: center !important;
  }

  .a4-benefit-row {
    font-size: 0.72rem !important;
  }

  .a4-benefit-total-row {
    font-size: 0.78rem !important;
  }

  .a4-plan-footer {
    padding: 0.5rem 0.75rem !important;
  }

  .a4-final-label {
    font-size: 0.8rem !important;
  }

  .a4-final-price {
    font-size: 1.16rem !important;
  }

  .a4-footer-sub-box {
    margin-top: 0.28rem !important;
    padding-top: 0.28rem !important;
  }

  .a4-footer-sub-main {
    font-size: 0.71rem !important;
  }

  .sub-strong-red,
  .sub-strong-blue {
    font-size: 0.78rem !important;
  }

  .a4-footer-sub-note {
    font-size: 0.65rem !important;
  }

  .a4-info-box {
    gap: 0.28rem !important;
  }

  .a4-card-policy-box {
    padding: 0.38rem 0.65rem !important;
    border-radius: 6px !important;
  }

  .a4-card-policy-header {
    margin-bottom: 0.22rem !important;
    padding-bottom: 0.16rem !important;
    font-size: 0.68rem !important;
    white-space: nowrap !important;
  }

  .a4-card-policy-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    row-gap: 0.38rem !important;
    column-gap: 0.35rem !important;
    width: 100% !important;
  }

  .a4-card-policy-item {
    font-size: 0.66rem !important;
    white-space: nowrap !important;
    gap: 0.22rem !important;
    line-height: 1.35 !important;
  }

  .a4-card-feature-label {
    font-size: 0.66rem !important;
    white-space: nowrap !important;
  }

  .a4-card-feature-text {
    font-size: 0.63rem !important;
    white-space: nowrap !important;
  }

  .a4-status-tag {
    width: 13px !important;
    height: 13px !important;
    font-size: 0.58rem !important;
  }

  .a4-checkpoints-grid {
    grid-template-columns: 1fr 1fr !important;
    padding: 0.32rem 0.6rem !important;
    gap: 0.2rem 0.55rem !important;
  }

  .a4-checkpoint-item {
    font-size: 0.7rem !important;
  }

  .a4-memo-box {
    padding: 0.35rem 0.6rem !important;
  }

  .a4-memo-title {
    font-size: 0.7rem !important;
  }

  .a4-memo-content {
    font-size: 0.7rem !important;
    line-height: 1.35 !important;
  }

  .a4-disclaimer {
    font-size: 0.55rem !important;
    line-height: 1.25 !important;
  }

  .a4-manager-card {
    flex-direction: row !important;
    padding: 0.48rem 0.75rem !important;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .a4-manager-photo {
    width: 42px !important;
    height: 42px !important;
  }

  .a4-manager-name {
    font-size: 0.86rem !important;
  }

  .a4-manager-brand {
    font-size: 0.68rem !important;
  }

  .a4-manager-quote {
    font-size: 0.65rem !important;
    line-height: 1.32 !important;
    white-space: normal !important;
  }

  .a4-manager-right {
    font-size: 0.65rem !important;
    gap: 0.12rem !important;
  }

  .a4-manager-qr {
    padding-left: 0.5rem !important;
  }

  .a4-manager-qr-label {
    font-size: 0.52rem !important;
    margin-top: 2px !important;
  }
}
